# qwen/qwen3-next-80b-a3b-thinking
# deepseek-ai/deepseek-v3.1

# BEST Reasoning Agent LLMS so Far: (need to adjust so as to show agent thoughts!)
# 1) nvidia/llama-3.3-nemotron-super-49b-v1.5 (0.6 / 0.95) - Thinking On.
# To Try:
# nvidia/nemotron-3-nano:latest
