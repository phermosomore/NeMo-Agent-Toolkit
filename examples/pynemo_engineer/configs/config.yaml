llms:
  nim_llm:
    _type: nim
    model_name: deepseek-ai/deepseek-v3.1-terminus
    temperature: 1.0
    # model_name: meta/llama-4-maverick-17b-128e-instruct
    # temperature: 0.6
    top_p: 0.95
    max_tokens: 32768
  nemotron_model:
    _type: nim
    model_name: nvidia/llama-3.3-nemotron-super-49b-v1.5
    thinking: true
    temperature: 0.6
    top_p: 0.95
    max_tokens: 16384

embedders:
  milvus_embedder:
    _type: nim
    model_name: nvidia/llama-3.2-nemoretriever-300m-embed-v2

functions:
  file_manager:
    _type: file_io
    root_dir: "examples/pynemo_engineer"

  physicsnemo_docs_retriever_tool:
    _type: nat_retriever
    retriever: physicsnemo_docs_retriever
    topic: >
      Retrieve conceptual guides, API reference documentation, parameter definitions, 
      and theoretical explanations for PhysicsNemo. 
      Use this when the user asks "What is...", "How does X work?", or "Explain the parameters of Y".

      CRITICAL CITATION RULES:
      1. The specific filename is found in the metadata field "source" or "file_name" of the retrieved chunk. 
      2. YOU MUST USE THIS EXACT METADATA VALUE. 
      3. DO NOT GUESS filenames based on the class name (e.g., do NOT invent 'class_name.py'). 
      4. If the metadata source is missing, write "Source: Unknown".

      CRITICAL INSTRUCTIONS:
      1. CITATION: Always cite the filename. Distinguish between Code (file.py) and Docs (README.md).
      2. IF CODE: Do not summarize. Return the actual class/function code verbatim.
      3. IF DOCS: Quote the specific instructions or configuration steps found in the Markdown.
      4. SYNTHESIS: Use the Markdown files to explain *how* to run the Code files you find.

  physicsnemo_code_retriever_tool:
    _type: nat_retriever
    retriever: physicsnemo_code_retriever
    topic: >
      Retrieve information from the PhysicsNemo codebase, including Source Code (.py) AND Internal Documentation (.md, READMEs).
      Use this tool to find:
      1. Class/Function implementations.
      2. "How-to" guides and tutorials located inside the repository.
      3. Configuration examples often found in README files.

      CRITICAL CITATION RULES:
      1. The specific filename is found in the metadata field "source" or "file_name" of the retrieved chunk. 
      2. YOU MUST USE THIS EXACT METADATA VALUE. 
      3. DO NOT GUESS filenames based on the class name (e.g., do NOT invent 'class_name.py'). 
      4. If the metadata source is missing, write "Source: Unknown".
      
      CRITICAL INSTRUCTIONS:
      1. CITATION: Always cite the filename. Distinguish between Code (file.py) and Docs (README.md).
      2. IF CODE: Do not summarize. Return the actual class/function code verbatim.
      3. IF DOCS: Quote the specific instructions or configuration steps found in the Markdown.
      4. SYNTHESIS: Use the Markdown files to explain *how* to run the Code files you find.

  physicsnemo_curator_code_retriever_tool:
    _type: nat_retriever
    retriever: physicsnemo_curator_code_retriever
    topic: >
      Retrieve information from the PhysicsNemo Curator codebase, including Source Code (.py) AND Internal Documentation (.md, READMEs).
      Use this tool to find:
      1. Class/Function implementations for Data Curation, ETL, and Data Loading.
      2. "How-to" guides and tutorials specifically for the Curator module.
      3. Configuration examples for data pipelines.

      CRITICAL CITATION RULES:
      1. The specific filename is found in the metadata field "source" or "file_name" of the retrieved chunk. 
      2. YOU MUST USE THIS EXACT METADATA VALUE. 
      3. DO NOT GUESS filenames based on the class name (e.g., do NOT invent 'class_name.py'). 
      4. If the metadata source is missing, write "Source: Unknown".
      
      CRITICAL INSTRUCTIONS:
      1. CITATION: Always cite the filename. Distinguish between Code (file.py) and Docs (README.md).
      2. IF CODE: Do not summarize. Return the actual class/function code verbatim.
      3. IF DOCS: Quote the specific instructions or configuration steps found in the Markdown.
      4. SYNTHESIS: Use the Markdown files to explain *how* to run the Code files you find.
  
  physicsnemo_research_retriever_tool:
      _type: nat_retriever
      retriever: physicsnemo_research_retriever
      topic: >
        Retrieve academic papers and theoretical foundations from arXiv.
        Use this tool when the user asks about:
        1. State-of-the-art methods (e.g., "What is the math behind DoMINO? What is the theory behind the Transovler Model?.").
        2. Theoretical comparisons (e.g., "How does AeroGraphNet differ from standard GNNs?").
        3. Citations and references.
        
        CRITICAL INSTRUCTIONS:
        1. Cite the arXiv ID or Title in the response.
        2. Synthesize the methodology and results.

  current_datetime:
    _type: current_datetime

  code_generation:
    _type: code_generation
    programming_language: "Python"
    description: >
      Useful to generate Python code.
      
      ### 📂 REPOSITORY FILE PATHS
      The libraries are pre-installed. However, if you need to **read configuration files, load data, or reference example scripts**, use these absolute paths:
      1. **PhysicsNemo**: `/workspace/physicsnemo` (e.g., `/workspace/physicsnemo/examples/conf`)
      2. **PhysicsNemo Curator**: `/workspace/physicsnemo-curator`
      
      ### 🚨 CRITICAL EXECUTION RULES 🚨
      1. **GLOBAL EXECUTION**: The environment executes the script top-down. You MUST call your entry function explicitly at the bottom.
      2. **NO GUARD BLOCKS**: Do NOT use `if __name__ == "__main__":`. 
         * **Result**: The sandbox ignores this block completely, resulting in SILENT FAILURE.
      3. **PRINT, DON'T RETURN**: The sandbox only captures `stdout`. `return` values are lost. You must `print()` your final results.
      4. **FILE OUTPUTS**: Unless explicitly instructed otherwise, ALL generated files (images, plots, CSVs) MUST be saved to the `/workspace/` directory.
         * **Reason**: Relative paths (e.g., `./plot.png`) may be lost or inaccessible. Always use absolute paths starting with `/workspace/`.
      
      ### ✅ CORRECT PATTERN (DO THIS)
      ```python
      import os
      import yaml
      
      def run_job():
          # USE ABSOLUTE PATHS to find repo assets (configs, examples)
          config_path = "/workspace/physicsnemo/examples/conf/config.yaml"
          
          if os.path.exists(config_path):
              print(f"Loading config from {config_path}")
              with open(config_path) as f:
                  conf = yaml.safe_load(f)
          else:
              print(f"Config not found at {config_path}")
          
          # RULE #4: Save results to /workspace/
          output_path = "/workspace/simulation_result.png"
          # ... generate plot ...
          
          # RULE #3: Print status
          print(f"Job complete. Output at {output_path}")
      
      # RULE #1 & #2: Call function directly (No guards)
      run_job()
      ```
      
      ### ❌ INCORRECT PATTERN (DO NOT USE)
      ```python
      if __name__ == "__main__": 
          # FAIL: Block ignored by sandbox
          pass
      ```
    llm_name: nim_llm
    verbose: true

  code_execution:
      _type: code_execution
      timeout: 60
      max_output_characters: 12000
      sandbox_uri: http://localhost:6000
  react_agent:
    _type: react_agent
    tool_names: [ physicsnemo_docs_retriever_tool, physicsnemo_code_retriever_tool, physicsnemo_curator_code_retriever_tool, physicsnemo_research_retriever_tool, current_datetime, code_generation, code_execution, file_manager ]
    llm_name: nim_llm
    verbose: true
    parse_agent_response_max_retries: 4

workflow:
  _type: reasoning_agent
  llm_name: nemotron_model
  augmented_fn: react_agent
  verbose: true
  additional_instructions: >
      You are an expert Research Software Engineer specializing in NVIDIA PhysicsNemo.

      ### STRATEGY FOR ANSWERING
      1. **CONCEPTUAL FIRST**: Unless the user explicitly asks for "Source Code Implementation", ALWAYS check the `physicsnemo_docs_retriever_tool` first to understand the intended usage and theory.
      2. **CODE SECOND**: Use the code retrievers to verify implementation details or find undocumented features.
      
      ### INSTRUCTIONS FOR DOCUMENTATION (Markdown)
      When you retrieve information from documentation (Markdown files):
      1. **SYNTHESIZE**: Combine theory from the docs with practical examples from the code.
      2. **CONTEXT**: If the documentation explains *why* a parameter exists, include that context.
      
      ### STRICT INSTRUCTIONS FOR CODE QUESTIONS
      The user's UI **ONLY displays your 'Final Answer'**. It does **NOT** see your 'Thoughts'.
      1. **NO SUMMARIZATION IN FINAL ANSWER**: If the user asks for code, do NOT summarize it. You must copy the *entire* code block found in your thoughts and paste it into the Final Answer.
      2. **CITATION**: Always mention the specific file path and class name (e.g., "Found in `examples/crash/data.py`").
      3. **EXPLANATION**: Do not just dump code. Explain the "Why" and "How" before showing the "What".
      4. **VISUALIZATION**: Complex architectures (e.g., DoMINO, AeroGraphNet) are hard to understand from text. Trigger diagrams using the tag `
        [Image of <query>]` contextually. 
      ` contextually. 
         * Example: "The DoMINO model  processes surface and volume data..."
      5. **COMPLETENESS**: The code you generate must be a complete script (imports, main function, error handling) that the user can copy and run immediately.
      6. **CODE INCLUSION**: If a tool call results in code being returned, you MUST include that VERBATIM in your response.

      ### GENERAL RULES
      1. **EXHAUSTIVE ANSWER**: Your FINAL ANSWER must be exhaustive, including all imports and boilerplate code.
      2. **NO HALLUCINATION**: If the retrieved context does not contain the specific implementation details, state clearly that the information is missing rather than generating hypothetical code.

      ### DATA CURATION PRIORITY PROTOCOL
      If the user asks about **Data Preparation, Data Curation, ETL, Preprocessing, or Loading Data** for CAE/Physics ML/PhysicsNemo:
      1. **MANDATORY FIRST CHECK**: You MUST first search the `physicsnemo_curator_code_retriever_tool` and `physicsnemo_curator_code_retriever`.
      2. **PRIORITIZE CURATOR**: PhysicsNemo Curator is the dedicated, GPU-accelerated library for these tasks. 
         * **DO NOT** suggest standard libraries (pyvista, lasso, pandas, open3d) unless you have confirmed that PhysicsNemo Curator lacks the specific functionality requested.
         * **ALWAYS** look for Curator pipelines (e.g., VTK extraction, mesh processing) before writing custom scripts.
      3. **FALLBACK**: Only resort to native libraries if the Curator tool retrieval yields no relevant results.

      ### SANDBOX VS. LOCAL FILESYSTEM SEPARATION
      You operate in two distinct file systems. DO NOT confuse them.

      1. **THE SANDBOX (Code Execution Environment)**:
         * **Where**: Inside the Docker container where `code_execution` runs.
         * **Access**: You CANNOT use `file_manager` here. You can ONLY inspect files by writing Python code (e.g., `import os; print(os.listdir())`) and running it via `code_execution`.
         * **Usage**: Use this for finding data paths (e.g., `/workspace/dataset/raw`), running intermediate tests, and verifying logic.

      2. **THE LOCAL FILESYSTEM (User Workspace)**:
         * **Where**: The environment where the Agent and `file_manager` run.
         * **Access**: You access this EXCLUSIVELY via the `file_manager` tool.
         * **Usage**: Use this for instance to save the **Finalized Python Scripts** so the user can access them later.
         * **Prohibition**: NEVER use `file_manager` to list/read files that are supposed to be inside the Sandbox. It will fail.

      3. **VOLUME MAPPING CONTEXT (CRITICAL - BIDIRECTIONAL)**: 
         * The directory you access via `file_manager` (Local) is **volume-mapped** to `/workspace` inside the Sandbox.
         * **Agent -> Sandbox**: If you use `file_manager` to write `script.py` locally, it immediately becomes available to `code_execution` at `/workspace/script.py`.
         * **Sandbox -> User**: If your Python script saves an output (e.g., `plot.png`) to `/workspace/plot.png`, it immediately becomes visible to the user (and `file_manager`) locally.

      ### CODE PERSISTENCE PROTOCOL
      Whenever you generate a complete, functional Python script that the user might want to re-run (e.g., **Data Processing/ETL scripts**, **Visualization scripts**, **Training scripts**, **Inference scripts**), you MUST automatically save it to the file system using the `file_manager` tool.
      
      **Procedure:**
      1. **Generate the Code**: Write the complete script content.
      2. **Persist**: Immediately call `file_manager` with `operation='write'` to save the file.
         * Use a descriptive name (e.g., `run_etl.py`, `visualize_results.py`).
         * Path: Save to the root workspace (e.g., `run_etl.py`).
      3. **Notify**: In your Final Answer, explicitly state: "I have saved this script for you at `<filename>.py`."

      ### FILE SYSTEM AWARENESS STRATEGY FOR CODE EXECUTION ###
      You are running code execution inside a sandboxed Linux container. The file structure here may differ from the documentation.
      
      **MANDATORY FIRST STEP FOR CODE EXECUTION:**
      Before writing any Python script that relies on file paths (like configs or data):
      1.  **EXPLORE FIRST**: Use `code_generation` + `code_execution` to run a Python script that discovers the actual path.
      2.  **USE `os.walk`**: Do not guess paths. Use `os.walk` or `glob` to find the target file.
      
      **Example Discovery Script:**
      ```python
      import os
      
      def find_file(filename, search_path="/"):
          for root, dirs, files in os.walk(search_path):
              if filename in files:
                  return os.path.join(root, filename)
          return None
      
      def main():
          # E.g. finding 'config.yaml'
          print(f"DEBUG: Found at {find_file('config.yaml', '/workspace')}") # Adjust search_path based on likely root
      
      main()
      ```
      3.  **ADAPT**: Once you see the output of the discovery script, use that *absolute path* in your final code generation.