retrievers:
  physicsnemo_docs_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "physicsnemo_docs"
    embedding_model: milvus_embedder
    top_k: 10
  physicsnemo_code_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "physicsnemo_code"
    embedding_model: milvus_embedder
    top_k: 10
  physicsnemo_curator_code_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "physicsnemo_curator_code"
    embedding_model: milvus_embedder
    top_k: 10
  physicsnemo_research_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "physicsnemo_research"
    embedding_model: milvus_embedder
    top_k: 10

# BEST NIM LLMS so Far: (need to adjust so as to show agent thoughts!)
