functions:
  physicsnemo_docs_retriever_tool:
    _type: nat_retriever
    retriever: physicsnemo_docs_retriever
    topic: >
      Retrieve conceptual guides, API reference documentation, parameter definitions, 
      and theoretical explanations for PhysicsNemo. 
      Use this when the user asks "What is...", "How does X work?", or "Explain the parameters of Y".

      CRITICAL CITATION RULES:
      1. The specific filename is found in the metadata field "source" or "file_name" of the retrieved chunk. 
      2. YOU MUST USE THIS EXACT METADATA VALUE. 
      3. DO NOT GUESS filenames based on the class name (e.g., do NOT invent 'class_name.py'). 
      4. If the metadata source is missing, write "Source: Unknown".

      CRITICAL INSTRUCTIONS:
      1. CITATION: Always cite the filename. Distinguish between Code (file.py) and Docs (README.md).
      2. IF CODE: Do not summarize. Return the actual class/function code verbatim.
      3. IF DOCS: Quote the specific instructions or configuration steps found in the Markdown.
      4. SYNTHESIS: Use the Markdown files to explain *how* to run the Code files you find.

  physicsnemo_code_retriever_tool:
    _type: nat_retriever
    retriever: physicsnemo_code_retriever
    topic: >
      Retrieve information from the PhysicsNemo codebase, including Source Code (.py) AND Internal Documentation (.md, READMEs).
      Use this tool to find:
      1. Class/Function implementations.
      2. "How-to" guides and tutorials located inside the repository.
      3. Configuration examples often found in README files.

      CRITICAL CITATION RULES:
      1. The specific filename is found in the metadata field "source" or "file_name" of the retrieved chunk. 
      2. YOU MUST USE THIS EXACT METADATA VALUE. 
      3. DO NOT GUESS filenames based on the class name (e.g., do NOT invent 'class_name.py'). 
      4. If the metadata source is missing, write "Source: Unknown".
      
      CRITICAL INSTRUCTIONS:
      1. CITATION: Always cite the filename. Distinguish between Code (file.py) and Docs (README.md).
      2. IF CODE: Do not summarize. Return the actual class/function code verbatim.
      3. IF DOCS: Quote the specific instructions or configuration steps found in the Markdown.
      4. SYNTHESIS: Use the Markdown files to explain *how* to run the Code files you find.

  physicsnemo_curator_code_retriever_tool:
    _type: nat_retriever
    retriever: physicsnemo_curator_code_retriever
    topic: >
      Retrieve information from the PhysicsNemo Curator codebase, including Source Code (.py) AND Internal Documentation (.md, READMEs).
      Use this tool to find:
      1. Class/Function implementations.
      2. "How-to" guides and tutorials located inside the repository.
      3. Configuration examples often found in README files.

      CRITICAL CITATION RULES:
      1. The specific filename is found in the metadata field "source" or "file_name" of the retrieved chunk. 
      2. YOU MUST USE THIS EXACT METADATA VALUE. 
      3. DO NOT GUESS filenames based on the class name (e.g., do NOT invent 'class_name.py'). 
      4. If the metadata source is missing, write "Source: Unknown".
      
      CRITICAL INSTRUCTIONS:
      1. CITATION: Always cite the filename. Distinguish between Code (file.py) and Docs (README.md).
      2. IF CODE: Do not summarize. Return the actual class/function code verbatim.
      3. IF DOCS: Quote the specific instructions or configuration steps found in the Markdown.
      4. SYNTHESIS: Use the Markdown files to explain *how* to run the Code files you find.
  
  
  # physicsnemo_docs_retriever_tool:
  #   _type: webpage_query
  #   webpage_url: https://docs.nvidia.com/physicsnemo/latest/index.html
  #   description: "Search for information about PhysicsNemo. For any questions about PhysicsNemo, you must use this tool!"
  #   embedder_name: nv-embedqa-e5-v5

  current_datetime:
    _type: current_datetime
  code_generation:
    _type: code_generation
    programming_language: "Python"
    description: >
      Useful to generate Python code.
      
      ### 🚨 CRITICAL EXECUTION RULES 🚨
      1. **NO ENTRY GUARDS**: Strictly **FORBIDDEN** to use `if __name__ == "__main__":`.
         * **Reason**: The execution sandbox ignores this block, resulting in empty output/silent failure.
      2. **DIRECT CALL**: You MUST call your `main()` function (or entry point) directly at the global scope at the bottom of the script.
      3. **Example**:
         ```python
         def main():
             print("Hello")
         
         # CORRECT:
         main()
         ```
    llm_name: nim_llm
    verbose: true
  code_execution:
      _type: code_execution
      timeout: 30
      max_output_characters: 3000
      sandbox_uri: http://localhost:6000
  react_agent:
    _type: react_agent
    tool_names: [ physicsnemo_docs_retriever_tool, physicsnemo_code_retriever_tool, physicsnemo_curator_code_retriever_tool, current_datetime, code_generation, code_execution ]
    llm_name: nim_llm
    verbose: true
    parse_agent_response_max_retries: 4


